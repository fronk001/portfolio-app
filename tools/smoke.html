<!DOCTYPE html>
<!-- UI smoke test: taps through the real app on the demo figures — every
     range, every metric and return method, Custom dates, the benchmark
     choice, the Holdings screen and a holding, then each of the other six
     screens (a position's ranges and a sold one, the map, cash events, the
     booked results), then the switch to Wealth and its three screens at
     every window, then the Budget's six screens at every window, month,
     year and pocket — and checks each draws (or says why not) without an
     error. Last, the same screens on figures from an engine run before they
     existed (?demo=old), and on a run that could not work Wealth and the
     Budget out (?demo=problem), which must each say so in a sentence.
     Run with: py tools/run_tests.py tools/smoke.html -->
<html lang="en">
<head><meta charset="utf-8"><title>Smoke test</title></head>
<body>
<pre id="out">running…</pre>
<iframe id="f" title="app" style="width:390px;height:1400px;border:0"></iframe>
<script type="module">
import { DEMO } from '../src/data/demo.js';

const BUDGET = ['right-now', 'budget-savings', 'month', 'yearly', 'forecast', 'pockets'];

const f = document.getElementById('f');
const log = [];
const check = (name, cond) => log.push({ name, ok: !!cond });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, what, ms = 8000) {
  for (const t = Date.now(); Date.now() - t < ms; await sleep(30)) {
    const v = fn();
    if (v) return v;
  }
  throw new Error(`timed out waiting for ${what}`);
}
let done = false;
(async () => { while (!done) await fetch('/__wait').catch(() => {}); })();

const errors = [];
const doc = () => f.contentDocument;
const tap = (act, v) => {
  const el = doc().querySelector(`[data-act="${act}"]${v ? `[data-v="${v}"]` : ''}`);
  if (!el) throw new Error(`no ${act} ${v || ''} to tap`);
  el.click();
};
const drawn = () => {
  const path = doc().querySelector('.chart-box svg path');
  return path && path.getAttribute('d').length > 20 && doc().querySelector('.readout').textContent.trim();
};
const chartOrReason = () => drawn() || (doc().querySelector('.chart-card .empty') || {}).textContent;
// The Budget's charts: a bar a month, read out above them.
const barsDrawn = () => doc().querySelector('.bars-box svg rect.bar') && doc().querySelector('.readout').textContent.trim();
const rects = () => doc().querySelectorAll('.bars-box rect.bar');
const choose = (act, value) => {
  const el = doc().querySelector(`[data-act="${act}"]`);
  if (!el) throw new Error(`no ${act} to choose from`);
  el.value = value;
  el.dispatchEvent(new Event('change', { bubbles: true }));
};
const options = (act) => [...doc().querySelectorAll(`[data-act="${act}"] option`)].map((o) => o.value);
// The one figure a Budget screen leads with, as its whole euros.
const headline = () => doc().querySelector('.lead-figure .headline').textContent.replace(/[^\d]/g, '');
const whole = (v) => String(Math.round(Math.abs(v)));
const text = () => doc().body.textContent;
const touch = (svg, dx) => {
  const box = svg.getBoundingClientRect();
  svg.dispatchEvent(new f.contentWindow.PointerEvent('pointerdown', { clientX: box.left + dx, clientY: box.top + 40, bubbles: true, pointerType: 'touch' }));
};
async function open(url) {
  await new Promise((r) => { f.addEventListener('load', r, { once: true }); f.src = url; });
  f.contentWindow.addEventListener('error', (e) => errors.push(e.message));
  f.contentWindow.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
}

try {
  await open('../src/index.html?demo');
  await until(drawn, 'the first chart');
  check('it opens on 1W and on value', doc().querySelector('.pill.on[data-v="1W"]') && doc().querySelector('.pill.on[data-v="Value"]'));

  for (const metric of ['Value', 'Return %', 'Total P&L']) {
    tap('metric', metric);
    for (const range of ['1W', '1M', '3M', '6M', 'YTD', '1Y', '3Y', 'All']) {
      tap('range', range);
      if (metric !== 'Return %') {
        check(`${metric} over ${range} draws`, drawn());
        continue;
      }
      for (const method of ['Simple %', 'Time %', 'Money %']) {
        tap('method', method);
        check(`${method} over ${range} draws or says why not`, chartOrReason());
      }
    }
  }

  tap('metric', 'Return %');
  tap('method', 'Time %');
  tap('range', 'Custom');
  const from = await until(() => doc().querySelector('[data-act="custom-from"]'), 'the date fields');
  check('Custom offers two dates', from && doc().querySelector('[data-act="custom-to"]'));
  from.value = '2024-03-01';
  from.dispatchEvent(new Event('change', { bubbles: true }));
  check('a custom range draws, named by its dates', drawn() && /Fri 1 Mar 2024|1 Mar 2024/.test(doc().querySelector('.chart-card').textContent));
  tap('method', 'Money %');
  check('Money % on a custom range says why it is not drawn', /fixed ranges/.test(chartOrReason()));

  tap('method', 'Simple %');
  const select = doc().querySelector('[data-act="bench"]');
  select.value = 'AEX';
  select.dispatchEvent(new Event('change', { bubbles: true }));
  check('a different benchmark is drawn beside the portfolio', doc().querySelectorAll('.chart-box svg path').length === 2 && /AEX/.test(doc().querySelector('.readout').textContent));

  // A finger on the chart reads that day off it.
  const svg = doc().querySelector('.chart-box svg');
  const box = svg.getBoundingClientRect();
  const before = doc().querySelector('.readout').textContent;
  svg.dispatchEvent(new f.contentWindow.PointerEvent('pointerdown', { clientX: box.left + 40, clientY: box.top + 50, bubbles: true, pointerType: 'touch' }));
  check('touching the chart reads out an earlier day', doc().querySelector('.readout').textContent !== before);

  f.contentWindow.location.hash = '#/holdings';
  await until(() => doc().querySelector('.holdings'), 'the holdings');
  const rows = doc().querySelectorAll('.hrow');
  check(`every holding is listed (${rows.length})`, rows.length === 8);
  rows[0].click();
  check('a holding opens to its details', doc().querySelector('.holding.open .detail') && /Average cost/.test(doc().querySelector('.detail').textContent));
  check('the facts say where the figures come from', /Made-up figures/.test(doc().querySelector('.facts').textContent));
  check('every screen has a tab', doc().querySelectorAll('.tabs a').length === 8);

  // Position detail, from the holding's own link.
  const isin = doc().querySelector('.holding.open .hrow').dataset.v;
  doc().querySelector('.holding.open .wide-row a').click();
  await until(() => drawn() && doc().querySelector('[data-act="position"]'), 'Position detail');
  check('the holding’s link opens its Position detail', doc().querySelector('[data-act="position"]').value === isin);
  check('Position detail opens on 3M, with its six figures', doc().querySelector('.pill.on[data-v="3M"]') && doc().querySelectorAll('.tiles.six .tile').length === 6);
  for (const range of ['1W', '1M', '6M', 'YTD', '1Y', '3Y', 'All']) {
    tap('pos-range', range);
    check(`the price chart over ${range} draws`, drawn());
  }
  check('trades are marked on it', doc().querySelectorAll('.chart-box .mark').length >= 2);
  tap('pos-range', 'Custom');
  const posFrom = doc().querySelector('[data-act="pos-from"]');
  check('Custom offers two dates on a position too', posFrom && doc().querySelector('[data-act="pos-to"]'));
  posFrom.value = '2025-01-02';
  posFrom.dispatchEvent(new Event('change', { bubbles: true }));
  check('a custom range of a position draws', drawn() && doc().querySelector('[data-act="pos-from"]').value === '2025-01-02');
  const picker = doc().querySelector('[data-act="position"]');
  const sold = picker.querySelector('optgroup[label="Sold"] option');
  picker.value = sold.value;
  picker.dispatchEvent(new Event('change', { bubbles: true }));
  // the picker holds its new value at once; the page is drawn anew after
  await until(() => !picker.isConnected && drawn(), 'a sold position');
  check('the picker leads to the sold position', doc().querySelector('[data-act="position"]').value === sold.value);
  const soldTiles = [...doc().querySelectorAll('.tiles.six .tile .v')].map((t) => t.textContent);
  check('a sold position shows no value, only what it booked', soldTiles[1] === '—' && /€/.test(soldTiles[3]));

  // Allocation: the map, a tile read out, the ranked list, the accounts.
  f.contentWindow.location.hash = '#/allocation';
  await until(() => doc().querySelector('.map-box .cell'), 'the map');
  const cells = doc().querySelectorAll('.map-box .cell');
  check(`a tile for every holding and the cash (${cells.length})`, cells.length === 9);
  cells[0].querySelector('rect').dispatchEvent(new f.contentWindow.PointerEvent('pointerdown', { bubbles: true }));
  check('tapping a tile reads it out', /% of the portfolio/.test(doc().querySelector('.map-readout').textContent));
  check('the ranked list matches the map', doc().querySelectorAll('.ranks li').length === 9);
  check('the two accounts are split out', /By account/.test(doc().body.textContent) && /Revolut/.test(doc().body.textContent));

  f.contentWindow.location.hash = '#/other-assets';
  await until(() => doc().querySelector('.asset'), 'the other assets');
  check('the other assets say where their value comes from', /median asking price across/.test(doc().body.textContent) && /thin market/.test(doc().body.textContent));

  f.contentWindow.location.hash = '#/cash';
  await until(() => drawn() && /What moved the cash/.test(doc().body.textContent), 'Cash');
  check('Cash draws its balance and what moved it', doc().querySelectorAll('.dtable tbody tr').length >= 4);
  tap('cash-recent');
  check('the recent cash events open', doc().querySelectorAll('.dtable.events tbody tr').length > 20);

  f.contentWindow.location.hash = '#/dividends';
  await until(() => drawn() && doc().querySelector('.years'), 'Dividends');
  check('Dividends has its years, its line and its payers', doc().querySelectorAll('.years li').length === 4 && doc().querySelectorAll('.dtable tbody tr').length === 3);

  f.contentWindow.location.hash = '#/realized';
  await until(() => doc().querySelector('.hrow.booked'), 'Realized');
  const booked = doc().querySelectorAll('.hrow.booked');
  check(`every position with a booked result (${booked.length}), the partly sold one striped`, booked.length === 5 && doc().querySelectorAll('.bar.partly').length === 1);
  booked[0].click();
  check('a booked position opens to its trades and fees', /First trade/.test(doc().querySelector('.holding.open .detail').textContent));

  // Wealth: one tap from any Portfolio screen, its three screens, every window.
  const facades = () => [...doc().querySelectorAll('.facades a')];
  check('the switch at the top offers the three facades in the tracker’s order, Portfolio on', facades().map((a) => a.textContent.trim()).join() === 'Portfolio,Budget,Wealth' && doc().querySelector('.facades a.on').dataset.facade === 'portfolio');
  doc().querySelector('.facades a[data-facade="wealth"]').click();
  await until(() => doc().querySelector('.tabs.three') && drawn(), 'Everything you own');
  const W = DEMO.wealth;
  check('Wealth opens on Everything you own, its total at the top', /Everything you own/.test(doc().querySelector('.hero').textContent) && /€/.test(doc().querySelector('.hero .big').textContent));
  check('Wealth has its own three tabs', doc().querySelectorAll('.tabs a').length === 3 && doc().querySelector('.tabs a.on').getAttribute('href') === '#/wealth');
  check('its chart opens on the tracker’s window, 1Y', doc().querySelector(`.pill.on[data-v="${W.default}"]`) && W.default === '1Y');
  check('the investments, cash, pensions and other assets are tiles', doc().querySelectorAll('.tiles .tile').length === 4 && /Other assets/.test(doc().querySelector('.tiles').textContent));
  for (const pill of W.pills) {
    tap('wealth-window', pill);
    const points = doc().querySelectorAll('.chart-box .point').length;
    check(`everything you own over ${pill} draws its ${W.everything.windows[pill].rows.length} rows`, drawn() && points === W.everything.windows[pill].rows.length && /everything you own (rose|fell) by/.test(doc().body.textContent));
  }
  tap('wealth-rows');
  check('the rows that do not add up open', doc().querySelectorAll('.dtable tbody tr').length === W.everything.disagreements.length);
  check('the footer says when the PC published the workbook', /published it on 23 Oct 2026 at 19:00/.test(doc().querySelector('.facts').textContent));

  doc().querySelector('.tabs a[href="#/savings"]').click();
  await until(() => drawn() && doc().querySelector('.bars-box svg'), 'Savings vs stock gains');
  check('the window carries over from Everything you own', doc().querySelector('.pill.on[data-v="All"]'));
  for (const pill of W.pills) {
    tap('wealth-window', pill);
    const s = W.savings[pill];
    const bars = s.saved_monthly.filter((v) => v != null).length + s.gained_monthly.filter((v) => v != null).length;
    check(`savings vs stock gains over ${pill}: two lines, ${bars} bars`, drawn() && doc().querySelectorAll('.chart-box svg path').length === 2 && doc().querySelectorAll('.bars-box rect.bar').length === bars);
  }
  check('the month still running is faded, both its bars', doc().querySelectorAll('.bars-box rect.bar[fill-opacity]').length === 2 && /still running/.test(doc().body.textContent));
  check('the months left out are said', /Left out: 16 months had spending but no salary/.test(doc().body.textContent));
  const barsSvg = doc().querySelector('.bars-box svg');
  const barsBox = barsSvg.getBoundingClientRect();
  const atRest = doc().querySelectorAll('.readout')[1].textContent;
  barsSvg.dispatchEvent(new f.contentWindow.PointerEvent('pointerdown', { clientX: barsBox.left + 30, clientY: barsBox.top + 40, bubbles: true, pointerType: 'touch' }));
  check('touching a month reads its two bars out', doc().querySelectorAll('.readout')[1].textContent !== atRest && /Put away|Spent|Not counted/.test(doc().querySelectorAll('.readout')[1].textContent));

  doc().querySelector('.tabs a[href="#/runway"]').click();
  await until(() => doc().querySelector('.runway .headline'), 'Runway');
  check('Runway leads with its one figure, in months', doc().querySelector('.runway .headline').textContent === `${W.runway.months.toFixed(1)} months` && /under a year/.test(doc().querySelector('.runway').textContent));

  doc().querySelector('.facades a[data-facade="portfolio"]').click();
  await until(() => doc().querySelector('.tabs a.on[href="#/realized"]'), 'back to Portfolio');
  check('the switch goes back to the Portfolio screen it left', doc().querySelectorAll('.tabs a').length === 8);
  doc().querySelector('.facades a[data-facade="wealth"]').click();
  await until(() => doc().querySelector('.tabs a.on[href="#/runway"]'), 'back to Wealth');
  check('and back to the Wealth screen it left', true);

  // Budget: one tap from anywhere, its six screens in two rows of three.
  const B = DEMO.budget;
  const M = DEMO['budget-months'];
  doc().querySelector('.facades a[data-facade="budget"]').click();
  await until(() => doc().querySelector('.tabs.six a.on[href="#/right-now"]') && doc().querySelector('.lead-figure'), 'Right now');
  const R = B.right_now;
  check('Budget opens on Right now, with six tabs', doc().querySelectorAll('.tabs a').length === 6 && /One salary in/.test(doc().querySelector('.hero').textContent));
  check('Right now leads with what is left where money has moved, not budget less spending', headline() === whole(R.left_started_eur) && /left in the categories you have spent in this month/.test(text()) && R.left_started_eur !== R.left_eur);
  check(`the ${R.rows.length - R.untouched_count} categories spent in are bars, the ${R.untouched_count} untouched listed`, doc().querySelectorAll('.ranks li').length === R.rows.length - R.untouched_count && doc().querySelectorAll('.dtable tbody tr').length === R.untouched_count);
  check('it says which day of the month it is, and why the two lefts differ', /day 23 of 31/.test(text()) && /4 categories have nothing recorded this month/.test(text()));
  check('a month that matches its sheet raises no card', !doc().querySelector('.card.prose'));
  check('the footer says when the PC read the sheets, and what is still in iCloud', /From your Numbers sheets as your PC last read them/.test(doc().querySelector('.facts').textContent) && /online-only in iCloud \(the 2025 savings file\)/.test(doc().querySelector('.facts').textContent));

  doc().querySelector('.tabs a[href="#/budget-savings"]').click();
  await until(() => barsDrawn() && doc().querySelector('[data-act="budget-window"]'), 'the Budget’s Savings');
  check('Savings opens on the tracker’s default window, the last 12 months', doc().querySelector('[data-act="budget-window"]').value === 'last12' && B.savings.default === 'last12');
  check('its dropdown offers every window the tracker’s does', options('budget-window').join() === B.savings.choices.map((c) => c[1]).join());
  for (const [label, spec] of B.savings.choices) {
    choose('budget-window', spec);
    const w = B.savings.windows[spec];
    const counted = w.saved.filter((v) => v != null).length;
    const years = new Set(w.months.filter((_, i) => w.saved[i] != null).map((m) => m.slice(0, 4))).size;
    for (const line of ['Year by year', 'All time']) {
      tap('budget-line', line);
      check(`Savings over ${label}, ${line.toLowerCase()}: ${counted} bars, ${line === 'All time' ? 'one line' : 'a line a year'}, its total on top`, barsDrawn()
        && rects().length === counted && doc().querySelectorAll('.bars-box path.over').length === (line === 'All time' ? 1 : years)
        && headline() === whole(w.total_saved_eur) && doc().querySelectorAll('.dtable')[0].querySelectorAll('tbody tr').length === w.years.length);
    }
  }
  check('the months whose savings file differs are said and listed', /In 1 of 9 months the Saved column/.test(text()) && doc().querySelectorAll('.dtable')[1].querySelectorAll('tbody tr').length === 1);
  const atRestSaved = doc().querySelector('.readout').textContent;
  touch(doc().querySelector('.bars-box svg'), 60);
  check('touching a month reads out what was put away', doc().querySelector('.readout').textContent !== atRestSaved && /Put away|more went out|Not counted/.test(doc().querySelector('.readout').textContent));

  doc().querySelector('.tabs a[href="#/month"]').click();
  await until(() => doc().querySelector('[data-act="budget-month"]'), 'Month');
  check('Month opens on the newest finished month, every month on record offered', doc().querySelector('[data-act="budget-month"]').value === M.default && M.by_month[M.default].state === 'finished' && options('budget-month').join() === M.months.join());
  tap('month-transactions');
  for (const period of M.months) {
    choose('budget-month', period);
    const x = M.by_month[period];
    const said = { finished: /(over|under) budget in/, in_progress: /This month is still running/, not_started: /This month has not started yet/ }[x.state];
    check(`${period}, ${x.state}: ${x.rows.length} categories, ${x.transactions.length} transactions, its figure on top`, doc().querySelectorAll('.ranks li').length === x.rows.length
      && doc().querySelectorAll('.dtable.tx tbody tr').length === x.transactions.length && said.test(text())
      && headline() === whole(x.state === 'finished' ? x.diff_eur : x.total_spent_eur));
    const card = doc().querySelector('.card.prose');
    const recalc = x.check && x.check.causes.join() === 'not_recalculated';
    check(`${period}: its sheet ${!x.check || x.check.state === 'match' ? 'matches and says so' : `differs (${x.check.causes}) and says so in a card`}`, !x.check || x.check.state === 'match'
      ? !card && /Matches your Numbers sheet/.test(text()) : card && card.classList.contains('warn') === !recalc);
  }
  choose('budget-month', '2026-03');
  check('a misspelt category is named, its space shown', /typed as “Groceries·”/.test(text()));
  choose('budget-month', '2026-08');
  check('a category the summary lacks is named', /Parking: used for/.test(text()) && /has no row in the summary/.test(text()));
  choose('budget-month', '2026-05');
  check('a file saved without recalculating is said gently', /without Numbers recalculating/.test(text()) && !doc().querySelector('.card.prose.warn'));
  tap('month-transactions');
  check('the transactions close again', !doc().querySelector('.dtable.tx') && /Show every transaction/.test(text()));

  doc().querySelector('.tabs a[href="#/yearly"]').click();
  await until(() => barsDrawn() && doc().querySelector('.tabs a.on[href="#/yearly"]'), 'Yearly overview');
  const O = B.overview;
  const onRecord = O.spent.filter((v) => v != null).length;
  check(`Yearly overview: a bar for each of the ${onRecord} months on record, the budget line through them`, rects().length === onRecord && doc().querySelectorAll('.bars-box path.over').length === 1
    && headline() === whole(O.ytd_diff_eur) && new RegExp(`${O.ytd_diff_eur > 0 ? 'over' : 'under'} budget so far in 2026`).test(text()));
  const fills = new Set([...rects()].map((r) => r.getAttribute('fill')));
  const august = O.months.indexOf('2026-08');
  check('its bars carry the engine’s colours, a month over budget among them', [...fills].every((c) => O.colours.includes(c)) && fills.has(O.colours[august]) && /over/.test(O.verdicts[august]));
  check('it says which months are blank and which differ from their file', /63 months are blank because no budget file was ever made/.test(text()) && /3 months differ from the total saved/.test(text()));
  const atRestYear = doc().querySelector('.readout').textContent;
  touch(doc().querySelector('.bars-box svg'), 60);
  check('touching a month reads it out in words', doc().querySelector('.readout').textContent !== atRestYear && doc().querySelector('.readout .plain').textContent.trim());

  doc().querySelector('.tabs a[href="#/forecast"]').click();
  await until(() => doc().querySelector('[data-act="forecast-year"]'), 'Forecast');
  check('Forecast offers every year begun', options('forecast-year').join() === B.forecast.years.join());
  for (const year of B.forecast.years) {
    choose('forecast-year', year);
    const x = B.forecast.by_year[year];
    check(`Forecast for ${year}: four figures and ${x.rows.length} categories, ${x.closed ? 'what it came to' : 'projected'}`, doc().querySelectorAll('.tiles .tile').length === 4
      && doc().querySelectorAll('.dtable tbody tr').length === x.rows.length && (x.closed ? /is finished, so this is what it came to/ : /The projection carries the pace/).test(text()));
  }

  doc().querySelector('.tabs a[href="#/pockets"]').click();
  await until(() => barsDrawn() && doc().querySelector('[data-act="pocket-year"]'), 'Pockets');
  check('Pockets offers every year begun', options('pocket-year').join() === B.pockets.years.join());
  let lastPocket = null;
  for (const year of B.pockets.years) {
    choose('pocket-year', year);
    const x = B.pockets.by_year[year];
    check(`Pockets in ${year}: ${x.rows.length} pockets, the most used opened`, doc().querySelectorAll('.ranks li').length === x.rows.length && doc().querySelector('[data-act="pocket-category"]').value === x.rows[0][0]);
    for (const [category] of x.rows) {
      choose('pocket-category', category);
      const p = x.details[category];
      const measured = p.series.filter((s) => s[1] != null).length;
      check(`behind ${category} in ${year}: ${measured} months, the budget in dots${p.budget_changed ? ', stepping' : ''}`, barsDrawn() && rects().length === measured
        && doc().querySelector('.bars-box path.over[stroke-dasharray]') && p.budget_changed === /steps because the budget itself changed/.test(text())
        && doc().querySelectorAll('.dtable.tx tbody tr').length === p.biggest.length);
      lastPocket = category;
    }
  }

  doc().querySelector('.facades a[data-facade="wealth"]').click();
  await until(() => doc().querySelector('.tabs a.on[href="#/runway"]'), 'Wealth again');
  doc().querySelector('.facades a[data-facade="budget"]').click();
  await until(() => doc().querySelector('.tabs a.on[href="#/pockets"]') && barsDrawn(), 'back to Budget');
  check('the switch goes back to the Budget screen it left, and the pocket chosen there', doc().querySelector('[data-act="pocket-category"]').value === lastPocket);

  // Figures from an engine run before these screens existed: a sentence each.
  await open('../src/index.html?demo=old#/allocation');
  await until(() => doc().querySelector('.note-card'), 'the older figures');
  check('older figures say the screen comes with the next run', /next run of the cloud engine/.test(doc().querySelector('.note-card').textContent));
  for (const screen of ['position', 'other-assets', 'cash', 'dividends', 'realized', 'wealth', 'savings', 'runway']) {
    f.contentWindow.location.hash = `#/${screen}`;
    await until(() => doc().querySelector(`.tabs a.on[href="#/${screen}"]`), screen);
    check(`${screen} says so too`, /next run of the cloud engine/.test(doc().querySelector('.note-card').textContent));
  }
  check('so does the top of Wealth', /next run of the cloud engine/.test(doc().querySelector('.hero').textContent));
  for (const screen of BUDGET) {
    f.contentWindow.location.hash = `#/${screen}`;
    await until(() => doc().querySelector(`.tabs a.on[href="#/${screen}"]`), screen);
    check(`${screen} says so too`, /next run of the cloud engine/.test(doc().querySelector('.note-card').textContent));
  }
  check('and the top of the Budget', /next run of the cloud engine/.test(doc().querySelector('.hero').textContent));

  // A run that could not work Wealth or the Budget out sends a sentence for
  // each instead; the Portfolio is untouched.
  await open('../src/index.html?demo=problem#/right-now');
  await until(() => doc().querySelector('.note-card'), 'a run that could not work the Budget out');
  for (const screen of [...BUDGET, 'wealth', 'savings', 'runway']) {
    f.contentWindow.location.hash = `#/${screen}`;
    await until(() => doc().querySelector(`.tabs a.on[href="#/${screen}"]`), screen);
    check(`${screen} says it could not be worked out, and why`, /could not be worked out on the cloud engine’s last run \(ValueError: made up for the demo\)/.test(doc().querySelector('.note-card').textContent));
  }
  check('so does the top of Wealth', /could not be worked out/.test(doc().querySelector('.hero').textContent));
  f.contentWindow.location.hash = '#/right-now';
  await until(() => doc().querySelector('.tabs a.on[href="#/right-now"]'), 'Right now');
  check('and the top of the Budget', /could not be worked out/.test(doc().querySelector('.hero').textContent));
  f.contentWindow.location.hash = '#/';
  await until(drawn, 'the Overview');
  check('the Portfolio still draws', drawn());
} catch (e) {
  log.push({ name: e.message, ok: false });
}
check(`no errors in the app${errors.length ? `: ${errors.join('; ')}` : ''}`, !errors.length);

done = true;
const failed = log.filter((x) => !x.ok);
document.getElementById('out').textContent = `${failed.length ? 'FAIL' : 'PASS'} ${log.length - failed.length}/${log.length}\n` +
  failed.map((x) => `✗ ${x.name}`).join('\n');
</script>
</body>
</html>
