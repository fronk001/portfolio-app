# Publishes the app to GitHub Pages on every push to main:
# https://fronk001.github.io/portfolio-app/
#
# tools/build.py turns src/ into dist/ (standard library only), which is what
# goes online. Same setup as Gym and Life Hub. The figures are never in here:
# the app fetches them from Firebase after signing in.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: python3 tools/build.py

      - name: Check the build, and that no real figures are published
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          if grep -q "__VERSION__\|__FILES__" dist/sw.js; then
            echo "::error::dist/sw.js was not stamped with a version and file list"
            exit 1
          fi
          if find dist -name "main.json" -o -name "series.json" | grep -q .; then
            echo "::error::dist/ contains engine output; the figures belong in Firebase only"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
